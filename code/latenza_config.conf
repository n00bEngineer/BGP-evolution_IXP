# =============================================================================
# FILE DI CONFIGURAZIONE: Sistema di Monitoraggio Latenza e Ottimizzazione BGP
# =============================================================================
# 
# SCOPO:
# File di configurazione centralizzato per l'intero sistema di monitoraggio della
# latenza di rete e ottimizzazione automatica del routing BGP.
# 
# DESCRIZIONE:
# Questo file contiene tutti i parametri configurabili per i vari componenti
# del sistema:
# - Monitoraggio sessioni BGP attive
# - Misurazione latenza di rete verso router peers
# - Generazione automatica filtri BIRD
# - Ottimizzazione preferenze routing basate su performance
#
# UTILIZZO:
# Tutti i parametri sono opzionali. Se omessi, verranno utilizzati valori di
# default ragionevoli. L'ordine dei parametri nel file non è importante.
# =============================================================================

# =============================================================================
# SEZIONE 1: CONFIGURAZIONE DATABASE MYSQL/MARIADB
# =============================================================================

# Nome utente per l'autenticazione al database MySQL/MariaDB
# Questo utente deve avere i permessi per leggere e scrivere sulle tabelle specificate
DB_USER="root"

# Password per l'autenticazione al database (ATTUALMENTE NON UTILIZZATA)
# Commentata perché il sistema utilizza l'autenticazione UNIX socket
# DB_PASS="12345"

# Nome del database principale dove vengono memorizzati tutti i dati di monitoraggio
# Il database deve esistere già sul server MySQL
DB_NAME="latenza_router"

# Nome della tabella dove vengono memorizzati i risultati delle misurazioni ping
# Struttura: id, probe_ip, target_ip, avg_ping, mdev_ping, packets_sent, timestamp
PING_TABLE="ping_results"

# Nome della tabella dove vengono memorizzate le sessioni BGP attive
# Struttura: id, protocol_name, peer_ip, last_seen
DB_TABLE="bgp_connections"

# Hostname o IP del server database MySQL/MariaDB
# "localhost" indica che il database è sulla stessa macchina del software di monitoraggio
DB_HOST="localhost"

# =============================================================================
# SEZIONE 2: NOMI PROGRAMMI E FILE DI SISTEMA
# =============================================================================

# Nome del programma C che monitora le sessioni BGP (compilato da get_ip.c)
# Questo programma legge l'output di 'birdc show protocols all' e popola la tabella DB_TABLE
RS_PROGRAM="get_connections"

# Nome del programma C che effettua le misurazioni ping massive (compilato da ping_monitor.c)
# Utilizza fping per misurare simultaneamente la latenza verso migliaia di IP
PING_PROGRAM="ping_results"

# Nome del file di configurazione BIRD generato automaticamente
# Contiene i filtri che modificano le preferenze BGP in base alle latenze misurate
FILTERS_FILE="latency_filters.conf"

# Intervallo tra l'esecuzione dei comandi ping verso gli IP/URL target (in secondi)
# Definisce quanto frequentemente vengono effettuate le misurazioni di latenza
# IPOTETICA FUNZIONE DA IMPLEMENTARE PER GESTIRE DINAMICAMENTE L'INTERVALLO TRA PING
# BGP_UPDATE_INTERVAL=17

# Intervallo di validità dei dati nel database (in secondi)
# Dopo questo tempo, i dati vecchi vengono considerati obsoleti per la generazione dei filtri
# FUNZIONE SPERIMENTALE DA IMPLEMENTARE
# DATA_VALIDITY_INTERVAL="300"  # 5 minuti

# Intervallo per l'acquisizione degli IP target (in secondi)
# Quanto frequentemente viene aggiornata la lista degli IP da monitorare
# FUNZIONE SPERIMENTALE DA IMPLEMENTARE
# GET_IP_INTERVAL=10

# Intervallo principale tra le esecuzioni complete del ciclo di monitoraggio (in secondi)
# Definisce la frequenza del ciclo principale di misurazione e aggiornamento
INTERVAL=60

# =============================================================================
# SEZIONE 3: PARAMETRI MISURAZIONE PING
# =============================================================================

# Numero di pacchetti ping inviati per ogni misurazione verso ciascun IP target
# Un numero più alto fornisce statistiche più accurate ma aumenta il tempo di misurazione
PING_COUNT=6

# Intervallo tra l'invio di pacchetti ping consecutivi verso lo stesso IP (in secondi)
# Influenza la distribuzione del carico durante le misurazioni massive
# FUNZIONE SPERIMENTALE DA IMPLEMENTARE
# PING_INTERVAL=10

# Nome della tabella del database che contiene i router connessi al route server
# Utilizzata per recuperare la lista degli IP target per le misurazioni ping
BGPCONN_TABLE="bgp_connections"

# Directory del filesystem dove BIRD cerca i file di configurazione
# I filtri generati automaticamente vengono salvati in questa directory
DIRECTORY_BIRD="/usr/local/etc"

# =============================================================================
# SEZIONE 4: PARAMETRI OTTIMIZZAZIONE BGP
# =============================================================================

# Valore di preferenza BGP di base assegnato a tutte le rotte
# Questo è il valore minimo di preferenza prima dell'applicazione dei bonus per latenza
BASE_PREFERENCE="100"

# Bonus massimo applicabile alle connessioni con latenza più bassa
# Viene aggiunto alla BASE_PREFERENCE per le connessioni più performanti
# FUNZIONE SPERIMENTALE DA IMPLEMENTARE
# MAX_BONUS="40"

# Latenza minima (in millisecondi) per ottenere il bonus massimo
# Le connessioni con latenza <= questo valore ricevono il bonus completo MAX_BONUS
# FUNZIONE SPERIMENTALE DA IMPLEMENTARE
# MIN_LATENCY_BONUS="1"

